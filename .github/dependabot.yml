version: 2
updates:
  - package-ecosystem: npm
    # TypeScript majors wait until @astrojs/check and typescript-eslint support them.
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
